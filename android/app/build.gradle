plugins {
    id 'com.android.application'
}

android {
    namespace 'com.arsalan.expenses'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arsalan.expenses'
        minSdk 24
        // 34 keeps the app out of Android 15's forced edge-to-edge layout.
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0.${System.getenv('VERSION_CODE') ?: '0'}"
        buildConfigField 'String', 'APP_URL', "\"${project.property('appUrl')}\""
    }

    signingConfigs {
        // Fixed key so new APKs install over old ones. Personal sideload app only.
        release {
            storeFile file('release.keystore')
            storePassword 'expenses'
            keyAlias 'expenses'
            keyPassword 'expenses'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
